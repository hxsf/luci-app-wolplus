name: Build ImmortalWrt IPK (amd64)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - '*'
  pull_request:
  workflow_dispatch:

env:
  IMMORTALWRT_VERSION: 24.10.5
  TARGET: x86/64
  PACKAGE_NAME: luci-app-wolplus

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 rsync unzip wget zlib1g-dev file \
            patch ca-certificates curl tar xz-utils zstd

      - name: Resolve SDK URL
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://downloads.immortalwrt.org/releases/${IMMORTALWRT_VERSION}/targets/${TARGET}"
          sdk_file="$(curl -fsSL "$base_url/" | grep -oE 'immortalwrt-sdk-[^"<>]*Linux-x86_64\.tar\.zst' | head -n1)"
          if [[ -z "$sdk_file" ]]; then
            echo "未找到 SDK 文件，请检查版本或目标架构: $base_url" >&2
            exit 1
          fi
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "sdk_file=$sdk_file" >> "$GITHUB_OUTPUT"
          echo "sdk_url=$base_url/$sdk_file" >> "$GITHUB_OUTPUT"

      - name: Cache SDK tarball
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk-cache
          key: sdk-${{ runner.os }}-${{ env.IMMORTALWRT_VERSION }}-${{ env.TARGET }}-${{ steps.sdk.outputs.sdk_file }}

      - name: Download SDK tarball
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sdk-cache"
          wget -nv -O "${RUNNER_TEMP}/sdk-cache/${{ steps.sdk.outputs.sdk_file }}" "${{ steps.sdk.outputs.sdk_url }}"

      - name: Extract SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sdk
          mkdir -p sdk
          tar --zstd -xf "${RUNNER_TEMP}/sdk-cache/${{ steps.sdk.outputs.sdk_file }}" -C sdk --strip-components=1

      - name: Cache OpenWrt build cache
        uses: actions/cache@v4
        with:
          path: |
            sdk/dl
            sdk/.ccache
            sdk/staging_dir/host
            sdk/staging_dir/hostpkg
            sdk/staging_dir/toolchain-*
            sdk/build_dir/host
            sdk/build_dir/hostpkg
          key: owrt-cache-${{ runner.os }}-${{ env.IMMORTALWRT_VERSION }}-${{ env.TARGET }}-${{ hashFiles('Makefile', 'luasrc/**', 'root/**', 'po/**') }}
          restore-keys: |
            owrt-cache-${{ runner.os }}-${{ env.IMMORTALWRT_VERSION }}-${{ env.TARGET }}-

      - name: Prepare package sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sdk/package/${PACKAGE_NAME}
          rsync -a --delete --exclude='.git' "$GITHUB_WORKSPACE/" "sdk/package/${PACKAGE_NAME}/"

      - name: Build IPK
        shell: bash
        run: |
          set -euo pipefail
          cd sdk

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "CONFIG_PACKAGE_${PACKAGE_NAME}=m" > .config
          make defconfig

          export CCACHE_DIR="$PWD/.ccache"
          export CC="ccache gcc"
          export CXX="ccache g++"

          make package/${PACKAGE_NAME}/compile -j"$(nproc)" V=s

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find bin/packages -type f -name "*${PACKAGE_NAME}*.ipk" -print -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;

      - name: Upload artifact (non-tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-ipk-${{ github.sha }}
          path: artifacts/*.ipk
          if-no-files-found: error

      - name: Publish release assets (tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.ipk
          generate_release_notes: true
